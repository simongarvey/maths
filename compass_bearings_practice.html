<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass and True Bearings Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 760px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    canvas {
      border: 1px solid #ddd;
      border-radius: 10px;
      margin: 20px 0;
      background: #fff;
      max-width: 100%;
      height: auto;
    }

    input {
      font-size: 18px;
      padding: 8px;
      width: 120px;
      text-align: center;
      margin: 8px;
      text-transform: uppercase;
    }

    input:disabled {
      background: #eee;
    }

    button {
      font-size: 18px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin: 8px;
    }

    button:disabled {
      background: #999 !important;
      cursor: not-allowed;
    }

    #startButton {
      background: #16a34a;
    }

    #startButton:hover:not(:disabled) {
      background: #15803d;
    }

    #checkButton {
      background: #2563eb;
    }

    #checkButton:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .feedback {
      font-size: 20px;
      font-weight: bold;
      margin-top: 16px;
      min-height: 28px;
    }

    .stats {
      font-size: 18px;
      margin-top: 10px;
    }

    .success {
      color: green;
    }

    .error {
      color: crimson;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Compass and True Bearings Practice</h1>
    <p>Enter the compass bearing and the three-figure true bearing.</p>
    <p>Your goal is to get <strong>5 correct in a row</strong>. A wrong answer resets the timer.</p>

    <canvas id="compassCanvas" width="520" height="520"></canvas>

    <div>
      <label>
        Compass Bearing:
        <input id="compassInput" placeholder="S50W" maxlength="4" disabled>
      </label>

      <label>
        True Bearing:
        <input id="trueInput" placeholder="230" maxlength="3" disabled>
      </label>
    </div>

    <button id="startButton" onclick="startGame()">Start Game</button>
    <button id="checkButton" onclick="checkAnswer()" disabled>Check Answer</button>

    <div class="feedback" id="feedback"></div>

    <div class="stats">
      Correct in a row: <span id="streak">0</span> / 5
    </div>

    <div class="stats">
      Time: <span id="timer">0.0</span> seconds
    </div>

    <div class="stats">
      Best time: <span id="bestTime">—</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("compassCanvas");
    const ctx = canvas.getContext("2d");

    const compassInput = document.getElementById("compassInput");
    const trueInput = document.getElementById("trueInput");
    const feedback = document.getElementById("feedback");
    const streakDisplay = document.getElementById("streak");
    const timerDisplay = document.getElementById("timer");
    const bestTimeDisplay = document.getElementById("bestTime");
    const startButton = document.getElementById("startButton");
    const checkButton = document.getElementById("checkButton");

    let currentQuestion;
    let streak = 0;
    let startTime = null;
    let timerInterval = null;
    let bestTime = localStorage.getItem("bestCompassTime");
    let gameActive = false;

    const angleColor = "#f59e0b";

    if (bestTime) {
      bestTimeDisplay.textContent = Number(bestTime).toFixed(1) + " seconds";
    }

    const directions = [
      { compass: "N", angle: 0 },
      { compass: "E", angle: 90 },
      { compass: "S", angle: 180 },
      { compass: "W", angle: 270 }
    ];

    function padBearing(num) {
      return String(num).padStart(3, "0");
    }

    function bearingToCanvasAngle(bearing) {
      return (bearing - 90) * Math.PI / 180;
    }

    function startGame() {
      streak = 0;
      gameActive = true;
      streakDisplay.textContent = "0";
      timerDisplay.textContent = "0.0";
      feedback.textContent = "";
      feedback.className = "feedback";
      compassInput.value = "";
      trueInput.value = "";
      compassInput.disabled = false;
      trueInput.disabled = false;
      startButton.disabled = true;
      checkButton.disabled = false;
      startTimer();
      generateQuestion();
      compassInput.focus();
    }

    function endGame(finalTime) {
      gameActive = false;
      clearInterval(timerInterval);
      checkButton.disabled = true;
      startButton.disabled = false;
      compassInput.disabled = true;
      trueInput.disabled = true;

      feedback.className = "feedback success";
      feedback.textContent = `Well done! You got 5 in a row in ${finalTime.toFixed(1)} seconds.`;

      if (!bestTime || finalTime < Number(bestTime)) {
        bestTime = finalTime;
        localStorage.setItem("bestCompassTime", bestTime);
        bestTimeDisplay.textContent = finalTime.toFixed(1) + " seconds";
        feedback.textContent += " New best time!";
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      startTime = Date.now();

      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        timerDisplay.textContent = elapsed.toFixed(1);
      }, 100);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerDisplay.textContent = "0.0";
      startTimer();
    }

    function generateQuestion() {
      const startDirection = directions[Math.floor(Math.random() * directions.length)];
      const angle = Math.floor(Math.random() * 80) + 10;

      let options = [];

      if (startDirection.compass === "N") {
        options = [
          { trueBearing: angle, compassBearing: `N${angle}E` },
          { trueBearing: 360 - angle, compassBearing: `N${angle}W` }
        ];
      }

      if (startDirection.compass === "S") {
        options = [
          { trueBearing: 180 - angle, compassBearing: `S${angle}E` },
          { trueBearing: 180 + angle, compassBearing: `S${angle}W` }
        ];
      }

      if (startDirection.compass === "E") {
        options = [
          { trueBearing: 90 - angle, compassBearing: `N${90 - angle}E` },
          { trueBearing: 90 + angle, compassBearing: `S${90 - angle}E` }
        ];
      }

      if (startDirection.compass === "W") {
        options = [
          { trueBearing: 270 + angle, compassBearing: `N${90 - angle}W` },
          { trueBearing: 270 - angle, compassBearing: `S${90 - angle}W` }
        ];
      }

      const chosen = options[Math.floor(Math.random() * options.length)];

      currentQuestion = {
        startDirection: startDirection.compass,
        startAngle: startDirection.angle,
        angleShown: angle,
        trueBearing: padBearing(chosen.trueBearing % 360),
        compassBearing: chosen.compassBearing,
        finalBearing: chosen.trueBearing % 360
      };

      drawCompass();
    }

    function drawCompass() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 190;

      drawCardinal("N", cx, cy - radius - 25);
      drawCardinal("S", cx, cy + radius + 40);
      drawCardinal("E", cx + radius + 30, cy + 8);
      drawCardinal("W", cx - radius - 35, cy + 8);

      drawLine(cx, cy, 0, radius, "#444", true);
      drawLine(cx, cy, 90, radius, "#444");
      drawLine(cx, cy, 180, radius, "#444");
      drawLine(cx, cy, 270, radius, "#444");

      drawArrow(cx, cy, currentQuestion.finalBearing, radius * 0.85, "#2563eb");
      drawAngleArcAndText(cx, cy);
    }

    function drawWaitingCompass() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 190;

      drawCardinal("N", cx, cy - radius - 25);
      drawCardinal("S", cx, cy + radius + 40);
      drawCardinal("E", cx + radius + 30, cy + 8);
      drawCardinal("W", cx - radius - 35, cy + 8);

      drawLine(cx, cy, 0, radius, "#444", true);
      drawLine(cx, cy, 90, radius, "#444");
      drawLine(cx, cy, 180, radius, "#444");
      drawLine(cx, cy, 270, radius, "#444");

      ctx.fillStyle = "#555";
      ctx.font = "20px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Press Start Game to begin", cx, cy + 70);
    }

    function drawCardinal(text, x, y) {
      ctx.fillStyle = "#111";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "center";
      ctx.fillText(text, x, y);
    }

    function drawLine(cx, cy, bearing, length, color, arrowhead = false) {
      const angle = bearingToCanvasAngle(bearing);
      const x = cx + Math.cos(angle) * length;
      const y = cy + Math.sin(angle) * length;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      if (arrowhead) {
        drawArrowHead(x, y, angle, color, 14);
      }
    }

    function drawArrow(cx, cy, bearing, length, color) {
      const angle = bearingToCanvasAngle(bearing);
      const x = cx + Math.cos(angle) * length;
      const y = cy + Math.sin(angle) * length;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.stroke();

      drawArrowHead(x, y, angle, color, 18);
    }

    function drawArrowHead(x, y, angle, color, size) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(
        x - size * Math.cos(angle - Math.PI / 6),
        y - size * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        x - size * Math.cos(angle + Math.PI / 6),
        y - size * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawAngleArcAndText(cx, cy) {
      const start = currentQuestion.startAngle;
      const end = currentQuestion.finalBearing;
      const arcRadius = 65;
      const textRadius = 42;

      const startRad = bearingToCanvasAngle(start);
      const endRad = bearingToCanvasAngle(end);

      let diff = (end - start + 360) % 360;
      let anticlockwise = false;

      if (diff > 180) {
        anticlockwise = true;
        diff = 360 - diff;
      }

      ctx.beginPath();
      ctx.arc(cx, cy, arcRadius, startRad, endRad, anticlockwise);
      ctx.strokeStyle = angleColor;
      ctx.lineWidth = 4;
      ctx.stroke();

      let midBearing;

      if (anticlockwise) {
        midBearing = (start - diff / 2 + 360) % 360;
      } else {
        midBearing = (start + diff / 2) % 360;
      }

      const midRad = bearingToCanvasAngle(midBearing);
      const textX = cx + Math.cos(midRad) * textRadius;
      const textY = cy + Math.sin(midRad) * textRadius + 8;

      ctx.fillStyle = angleColor;
      ctx.font = "bold 22px Arial";
      ctx.textAlign = "center";
      ctx.fillText(currentQuestion.angleShown + "°", textX, textY);
    }

    function checkAnswer() {
      if (!gameActive) return;

      const userCompass = compassInput.value.trim().toUpperCase().replace(/\s+/g, "");
      const userTrue = trueInput.value.trim();

      const correctCompass = currentQuestion.compassBearing;
      const correctTrue = currentQuestion.trueBearing;

      if (userCompass === correctCompass && userTrue === correctTrue) {
        streak++;
        feedback.textContent = "Correct!";
        feedback.className = "feedback success";
      } else {
        streak = 0;
        feedback.textContent = `Incorrect. Correct answers: ${correctCompass} and ${correctTrue}. Timer restarted.`;
        feedback.className = "feedback error";
        resetTimer();
      }

      streakDisplay.textContent = streak;
      compassInput.value = "";
      trueInput.value = "";

      if (streak === 5) {
        const finalTime = (Date.now() - startTime) / 1000;
        endGame(finalTime);
        return;
      }

      generateQuestion();
      compassInput.focus();
    }

    compassInput.addEventListener("keyup", e => {
      if (e.key === "Enter") trueInput.focus();
    });

    trueInput.addEventListener("keyup", e => {
      if (e.key === "Enter") checkAnswer();
    });

    drawWaitingCompass();
  </script>
</body>
</html>
